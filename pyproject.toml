[project]
name = "expense-tracker"
version = "0.1.0"
description = "Self-hosted personal expense tracker with Gmail IMAP and Telegram bot"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Marcus Peh" }
]

dependencies = [
    "python-telegram-bot>=20.0",
    "tortoise-orm>=0.20.0",
    "aiomysql>=0.2.0",
    "aerich>=0.7.0",
    "pydantic-settings>=2.0.0",
    "imap-tools>=1.4.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "freezegun>=1.4.0",
    "ruff>=0.3.0",
]

[tool.setuptools]
packages = { find = { where = [ "." ], include = [ "app*" ], exclude = [ "openspec*", "tests*" ] } }

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
